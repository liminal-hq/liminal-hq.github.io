<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="t d">
  <title id="t">Inside a Liminal Pack</title>
  <desc id="d">A pack spanning two disks. Volume 1, SETUP.LPK, holds a 48-byte header starting with the bytes LPK and 0x1A, the directory with an 8.3 name, an optional long name, a size and a CRC-32 for each file, then chunks of up to 32 KiB, each an independent raw DEFLATE stream or stored bytes with a 12-byte header and its own CRC-32, then a next-volume marker and a 32-byte footer starting LPKE. Volume 2, SETUP.L02, holds a header, more chunks and a footer, with no directory. A chunk never straddles two volumes.</desc>
  <style>
    .bg { fill: #0c0c12; }
    .box { fill: #16161f; stroke: rgba(255,255,255,0.2); stroke-width: 1.2; }
    .chunk { fill: #0f1a3d; stroke: #60a5fa; stroke-width: 1.2; }
    .dir { fill: #1d1430; stroke: #a78bfa; stroke-width: 1.2; }
    .edge { fill: #2a1d0c; stroke: #ffaa40; stroke-width: 1.2; }
    .h { font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
    .p { font: 13.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #b4bfce; }
    .m { font: 13px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; fill: #22d3ee; }
    .note { font: 13.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffaa40; }
  </style>
  <rect class="bg" width="760" height="470" rx="14"/>
  <text class="h" x="30" y="38">A Liminal Pack on two floppies</text>

  <text class="h" x="30" y="78">Disk 1: SETUP.LPK</text>
  <rect class="edge" x="30" y="92" width="110" height="96" rx="6"/>
  <text class="h" x="42" y="116">Header</text>
  <text class="m" x="42" y="138">LPK 1A</text>
  <text class="p" x="42" y="160">48 bytes</text>
  <text class="p" x="42" y="178">own CRC-32</text>

  <rect class="dir" x="148" y="92" width="170" height="96" rx="6"/>
  <text class="h" x="160" y="116">Directory</text>
  <text class="m" x="160" y="138">SETUP.PRJ</text>
  <text class="m" x="160" y="156">LEVELS/EP1.LVL</text>
  <text class="p" x="160" y="178">8.3 name, size, CRC-32</text>

  <rect class="chunk" x="326" y="92" width="120" height="96" rx="6"/>
  <text class="h" x="338" y="116">Chunk</text>
  <text class="p" x="338" y="138">up to 32 KiB</text>
  <text class="p" x="338" y="156">raw DEFLATE</text>
  <text class="p" x="338" y="178">or stored</text>

  <rect class="chunk" x="454" y="92" width="120" height="96" rx="6"/>
  <text class="h" x="466" y="116">Chunk</text>
  <text class="p" x="466" y="138">12-byte header</text>
  <text class="p" x="466" y="156">with a CRC-32</text>

  <rect class="box" x="582" y="92" width="64" height="96" rx="6"/>
  <text class="p" x="592" y="134">next</text>
  <text class="p" x="592" y="152">disk</text>

  <rect class="edge" x="654" y="92" width="76" height="96" rx="6"/>
  <text class="h" x="664" y="116">Footer</text>
  <text class="m" x="664" y="138">LPKE</text>
  <text class="p" x="664" y="160">32 B</text>

  <text class="h" x="30" y="248">Disk 2: SETUP.L02</text>
  <rect class="edge" x="30" y="262" width="110" height="80" rx="6"/>
  <text class="h" x="42" y="286">Header</text>
  <text class="p" x="42" y="308">volume 2 of 2</text>

  <rect class="chunk" x="148" y="262" width="120" height="80" rx="6"/>
  <text class="h" x="160" y="286">Chunk</text>
  <text class="p" x="160" y="308">continues</text>
  <text class="p" x="160" y="326">the same file</text>

  <rect class="chunk" x="276" y="262" width="120" height="80" rx="6"/>
  <text class="h" x="288" y="286">Chunk</text>

  <rect class="edge" x="404" y="262" width="76" height="80" rx="6"/>
  <text class="h" x="414" y="286">Footer</text>
  <text class="m" x="414" y="308">LPKE</text>

  <text class="note" x="30" y="390">Each chunk decodes on its own, so the reader keeps one decoded chunk (at most 32 KiB) and a 256-byte read buffer.</text>
  <text class="note" x="30" y="414">A chunk never straddles two disks. Only volume 1 has a directory.</text>
  <text class="p" x="30" y="446">Every DOS name is 8.3 and upper case; a long name is optional, for systems that have them.</text>
</svg>
