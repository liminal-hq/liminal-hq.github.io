<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" width="760" height="660" role="img" aria-labelledby="t d">
  <title id="t">How the stub loads a flat 32-bit image</title>
  <desc id="d">On the left, SETUP.EXE on disk: the 22,528-byte CWSDSTUB stub with CWSDPMI inside it, a 168-byte COFF header, then .text and .data at 512-byte aligned offsets. On the right, memory when _start runs: conventional memory below 1 MiB holds the PSP, the stub's data, the 32 KiB transfer buffer and VGA text memory; extended memory holds the image block that CS and DS point at, with .text at 0x1000, .data, and .bss with the 256 KiB stack, plus heap blocks from DPMI function 0501h. CWSDPMI sits between the program and DOS.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffaa40"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #0c0c12; }
    .cap { font: 600 16px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
    .sub { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #b4bfce; }
    .t { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
    .s { font: 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #b4bfce; }
    .m { font: 12.5px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; fill: #22d3ee; }
    .o { font: 12.5px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; fill: #ffaa40; }
    .stub { fill: #2a1a3d; stroke: #a78bfa; stroke-width: 1.2; }
    .hdr { fill: #1c1c26; stroke: rgba(255,255,255,0.25); stroke-width: 1.2; }
    .code { fill: #3a2410; stroke: #ffaa40; stroke-width: 1.2; }
    .low { fill: #0f1a3d; stroke: #60a5fa; stroke-width: 1.2; }
    .ext { fill: #13131b; stroke: rgba(255,255,255,0.2); stroke-width: 1.2; }
    .null { fill: #101016; stroke: rgba(255,255,255,0.15); stroke-dasharray: 4 3; }
    .line { stroke: #ffaa40; stroke-width: 1.8; fill: none; }
  </style>
  <rect class="bg" width="760" height="660" rx="14"/>

  <!-- Left: the file -->
  <text class="cap" x="30" y="40">SETUP.EXE on disk</text>
  <text class="sub" x="30" y="60">offsets in the file</text>

  <rect class="stub" x="30" y="78" width="250" height="120" rx="6"/>
  <text class="t" x="44" y="102">MZ stub: CWSDSTUB.EXE</text>
  <text class="s" x="44" y="122">real-mode loader with the</text>
  <text class="s" x="44" y="140">CWSDPMI host inside it</text>
  <text class="m" x="44" y="182">0x0000 to 0x57FF, 22,528 B</text>

  <rect class="hdr" x="30" y="206" width="250" height="74" rx="6"/>
  <text class="t" x="44" y="228">COFF header, 168 B</text>
  <text class="s" x="44" y="247">file header, a.out header,</text>
  <text class="s" x="44" y="265">.text .data .bss headers</text>

  <rect class="code" x="30" y="288" width="250" height="110" rx="6"/>
  <text class="t" x="44" y="312">.text (code, rodata)</text>
  <text class="m" x="44" y="332">0x21800 B, at COFF + 0x200</text>

  <rect class="code" x="30" y="406" width="250" height="40" rx="6"/>
  <text class="t" x="44" y="431">.data, 0x200 B</text>

  <text class="s" x="30" y="472">.bss takes no file space:</text>
  <text class="s" x="30" y="490">the header only gives its size</text>

  <!-- Arrows -->
  <path class="line" d="M280 343 C 360 343, 360 452, 440 452" marker-end="url(#a)"/>
  <path class="line" d="M280 426 C 360 426, 360 508, 440 508" marker-end="url(#a)"/>
  <text class="o" x="296" y="540">copied in 512-byte</text>
  <text class="o" x="296" y="556">reads; .bss zeroed</text>

  <!-- Right: memory -->
  <text class="cap" x="440" y="40">Memory when _start runs</text>
  <text class="sub" x="440" y="60">CWSDPMI maps the first 1 MiB at linear 0</text>

  <rect class="low" x="440" y="78" width="290" height="190" rx="6"/>
  <text class="t" x="454" y="100">Conventional memory, below 1 MiB</text>
  <text class="s" x="454" y="124">DOS, the PSP and the environment</text>
  <text class="s" x="454" y="146">stub data: FS:0 is _GO32_StubInfo</text>
  <text class="s" x="454" y="168">32 KiB transfer buffer (INT 21h data)</text>
  <text class="s" x="454" y="190">VGA: A0000h graphics, B8000h text</text>
  <text class="t" x="454" y="222">CWSDPMI, the DPMI host</text>
  <text class="s" x="454" y="242">INT 31h services; reflects INT 21h</text>
  <text class="s" x="454" y="258">and INT 10h to real mode</text>

  <text class="t" x="440" y="300">Image block (DPMI 0501h)</text>
  <text class="s" x="440" y="318">CS and DS base = block start; 448 KiB here</text>

  <rect class="null" x="440" y="330" width="290" height="36" rx="6"/>
  <text class="m" x="454" y="353">0x0000</text>
  <text class="s" x="520" y="353">left empty: null guard</text>

  <rect class="code" x="440" y="374" width="290" height="92" rx="6"/>
  <text class="m" x="454" y="398">0x1000</text>
  <text class="t" x="520" y="398">.text</text>
  <text class="s" x="520" y="418">entry point _start</text>

  <rect class="code" x="440" y="474" width="290" height="40" rx="6"/>
  <text class="m" x="454" y="499">0x22800</text>
  <text class="t" x="530" y="499">.data</text>

  <rect class="ext" x="440" y="522" width="290" height="60" rx="6"/>
  <text class="m" x="454" y="546">0x22A00</text>
  <text class="t" x="530" y="546">.bss</text>
  <text class="s" x="454" y="568">statics and the 256 KiB stack</text>

  <rect class="ext" x="440" y="592" width="290" height="44" rx="6"/>
  <text class="t" x="454" y="612">Heap: more 0501h blocks</text>
  <text class="s" x="454" y="629">256 KiB or larger, first-fit free list</text>
</svg>
