<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 900" width="440" height="900" role="img" aria-labelledby="t d">
  <title id="t">How the stub loads a go32 program</title>
  <desc id="d">On disk, SETUP.EXE holds the 22,528-byte CWSDSTUB stub with the CWSDPMI host inside, a 168-byte header, the code and the data; the zero-filled .bss takes no file space. The stub copies code and data into memory in 512-byte reads and zeroes .bss. In memory, conventional memory below 1 MiB holds the PSP, the stub's data, the 32 KiB transfer buffer and video memory, CWSDPMI sits beside it, and an image block from DPMI holds a null guard, code at 0x1000, data, .bss with the 256 KiB stack, and heap blocks from DPMI.</desc>
  <style>
    .bg { fill: #0c0c12; }
    .box { fill: #16161f; stroke: rgba(255,255,255,0.25); stroke-width: 1.2; }
    .code { fill: #0f1a3d; stroke: #60a5fa; stroke-width: 1.2; }
    .data { fill: #1d1430; stroke: #a78bfa; stroke-width: 1.2; }
    .host { fill: #2a1d0c; stroke: #ffaa40; stroke-width: 1.2; }
    .h { font: 600 17px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
    .p { font: 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #c3ccd8; }
    .m { font: 14px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; fill: #22d3ee; }
    .note { font: 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffaa40; }
  </style>
  <rect class="bg" width="440" height="900" rx="14"/>

  <text class="h" x="20" y="34">On disk: SETUP.EXE</text>
  <rect class="host" x="20" y="48" width="400" height="58" rx="6"/>
  <text class="h" x="34" y="72">MZ stub: CWSDSTUB.EXE</text>
  <text class="p" x="34" y="94">22,528 bytes, CWSDPMI inside</text>
  <rect class="box" x="20" y="112" width="400" height="58" rx="6"/>
  <text class="h" x="34" y="136">Header, 168 bytes</text>
  <text class="p" x="34" y="158">COFF, a.out, three section headers</text>
  <rect class="code" x="20" y="176" width="400" height="40" rx="6"/>
  <text class="h" x="34" y="202">.text: code</text>
  <text class="m" x="250" y="202">0x21800 bytes</text>
  <rect class="data" x="20" y="222" width="400" height="40" rx="6"/>
  <text class="h" x="34" y="248">.data</text>
  <text class="m" x="250" y="248">0x200 bytes</text>
  <text class="p" x="20" y="286">.bss takes no space in the file</text>

  <text class="note" x="20" y="326">The stub copies code and data in 512-byte</text>
  <text class="note" x="20" y="348">reads and zeroes .bss.</text>

  <text class="h" x="20" y="396">In memory when _start runs</text>
  <rect class="box" x="20" y="410" width="400" height="124" rx="6"/>
  <text class="h" x="34" y="434">Conventional memory, below 1 MiB</text>
  <text class="p" x="34" y="458">the PSP and the environment</text>
  <text class="p" x="34" y="480">the stub's data, reached through FS</text>
  <text class="p" x="34" y="502">32 KiB transfer buffer for INT 21h</text>
  <text class="p" x="34" y="524">video memory at A0000h and B8000h</text>
  <rect class="host" x="20" y="540" width="400" height="58" rx="6"/>
  <text class="h" x="34" y="564">CWSDPMI, the DPMI host</text>
  <text class="p" x="34" y="586">passes INT 21h and INT 10h to real mode</text>

  <text class="h" x="20" y="630">Image block from DPMI</text>
  <rect class="box" x="20" y="642" width="400" height="36" rx="6"/>
  <text class="m" x="34" y="666">0x0000</text>
  <text class="p" x="110" y="666">empty: a null-pointer guard</text>
  <rect class="code" x="20" y="684" width="400" height="36" rx="6"/>
  <text class="m" x="34" y="708">0x1000</text>
  <text class="p" x="110" y="708">.text, entry point _start</text>
  <rect class="data" x="20" y="726" width="400" height="36" rx="6"/>
  <text class="m" x="34" y="750">0x22800</text>
  <text class="p" x="110" y="750">.data</text>
  <rect class="data" x="20" y="768" width="400" height="36" rx="6"/>
  <text class="m" x="34" y="792">0x22A00</text>
  <text class="p" x="110" y="792">.bss and the 256 KiB stack</text>
  <rect class="box" x="20" y="818" width="400" height="58" rx="6"/>
  <text class="h" x="34" y="842">Heap</text>
  <text class="p" x="34" y="864">more DPMI blocks, first-fit</text>
</svg>
