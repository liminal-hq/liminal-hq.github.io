<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-labelledby="t d">
  <title id="t">From Rust source to a DOS executable</title>
  <desc id="d">Five stages: Rust crates are compiled by rustc with -Zbuild-std for the dos-elf.json target, rust-lld links them with link.ld into a static ELF, elf2go32.py packs the ELF behind the CWSDSTUB.EXE stub into SETUP.EXE, and DOS runs it.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffaa40"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #0c0c12; }
    .box { fill: #16161f; stroke: rgba(255,255,255,0.2); stroke-width: 1.2; }
    .dos { fill: #0f1a3d; stroke: #60a5fa; stroke-width: 1.2; }
    .h { font: 600 17px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
    .p { font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #b4bfce; }
    .m { font: 13.5px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; fill: #22d3ee; }
    .tool { font: 13.5px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; fill: #ffaa40; }
    .line { stroke: #ffaa40; stroke-width: 2; fill: none; }
  </style>
  <rect class="bg" width="760" height="640" rx="14"/>

  <rect class="box" x="30" y="24" width="700" height="76" rx="10"/>
  <text class="h" x="50" y="54">Rust crates</text>
  <text class="m" x="50" y="80">setup (main, Platform for DOS)  +  li-retro (no_std core)  +  rt (runtime)</text>

  <path class="line" d="M80 100 V150" marker-end="url(#a)"/>
  <text class="tool" x="100" y="122">rustc + LLVM, cargo -Zbuild-std, --target dos-elf.json</text>
  <text class="p" x="100" y="142">i486, x87 hard float, SIMD off, panic = abort, static relocation</text>

  <rect class="box" x="30" y="156" width="700" height="76" rx="10"/>
  <text class="h" x="50" y="186">i486 object code</text>
  <text class="p" x="50" y="212">your crates, plus core, alloc and compiler_builtins compiled from rust-src</text>

  <path class="line" d="M80 232 V282" marker-end="url(#a)"/>
  <text class="tool" x="100" y="254">rust-lld -T link.ld -nostdlib -static</text>
  <text class="p" x="100" y="274">every symbol and relocation resolved here, at link time</text>

  <rect class="box" x="30" y="288" width="700" height="76" rx="10"/>
  <text class="h" x="50" y="318">Static ELF executable (ET_EXEC, entry 0x1000)</text>
  <text class="m" x="50" y="344">LOAD R E 0x21800 bytes (.text)   LOAD RW 0x200 + bss (.data, .bss)</text>

  <path class="line" d="M80 364 V414" marker-end="url(#a)"/>
  <text class="tool" x="100" y="386">elf2go32.py  stub.exe  setup  SETUP.EXE</text>
  <text class="p" x="100" y="406">139 lines of Python: rearranges bytes into a COFF image behind the stub</text>

  <rect class="box" x="30" y="420" width="700" height="76" rx="10"/>
  <text class="h" x="50" y="450">SETUP.EXE, 160,768 bytes</text>
  <text class="m" x="50" y="476">CWSDSTUB.EXE 22,528  +  COFF header 168 (padded to 512)  +  sections</text>

  <path class="line" d="M80 496 V546" marker-end="url(#a)"/>
  <text class="tool" x="100" y="518">DOS loads the MZ stub; the stub starts CWSDPMI</text>
  <text class="p" x="100" y="538">protected mode, copy .text and .data, zero .bss, far jump to _start</text>

  <rect class="dos" x="30" y="552" width="700" height="66" rx="10"/>
  <text class="h" x="50" y="580">DOS 5 or later on a 386 or later</text>
  <text class="p" x="50" y="603">tested headless in DOSBox Staging 0.83.0 with cputype = 486</text>
</svg>
