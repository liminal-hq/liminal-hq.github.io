<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 576" width="760" height="576" role="img" aria-labelledby="t d">
  <title id="t">Inside MSGBOX.EXE, 620 bytes</title>
  <desc id="d">The file from top to bottom: a 128-byte MZ header and DOS stub at offset 0, the 64-byte NE header at 0x80, the segment table at 0xC0, the name, module and entry tables at 0xD0, the 261-byte code segment at 0x110, four relocation records at 0x215 that point back to the far-call operands in the code, and the 44-byte data segment at 0x240 whose first 16 bytes are reserved for Windows. The file ends at 0x26C.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffaa40"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #0c0c12; }
    .box { fill: #16161f; stroke: rgba(255,255,255,0.2); stroke-width: 1.2; }
    .code { fill: #0f1a3d; stroke: #60a5fa; stroke-width: 1.2; }
    .data { fill: #1d1430; stroke: #a78bfa; stroke-width: 1.2; }
    .rsv { fill: #3b2a5c; }
    .site { fill: #ffaa40; }
    .h { font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
    .p { font: 13.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #b4bfce; }
    .off { font: 13px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; fill: #8b949e; }
    .m { font: 13px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; fill: #22d3ee; }
    .tool { font: 13px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; fill: #ffaa40; }
    .line { stroke: #ffaa40; stroke-width: 1.6; fill: none; }
  </style>
  <rect class="bg" width="760" height="576" rx="14"/>
  <text class="h" x="30" y="38">MSGBOX.EXE, 620 bytes, as ne_pack.py lays it out</text>

  <text class="off" x="30" y="76">0x000</text>
  <rect class="box" x="100" y="60" width="300" height="64" rx="6"/>
  <text class="h" x="116" y="86">MZ header and DOS stub</text>
  <text class="p" x="116" y="108">128 bytes; prints a polite refusal</text>

  <text class="off" x="30" y="142">0x080</text>
  <rect class="box" x="100" y="126" width="300" height="40" rx="6"/>
  <text class="h" x="116" y="151">NE header</text>
  <text class="m" x="200" y="151">flags 0302, SS:SP 2:0</text>

  <text class="off" x="30" y="184">0x0C0</text>
  <rect class="box" x="100" y="168" width="300" height="28" rx="6"/>
  <text class="p" x="116" y="187">segment table: 2 entries</text>

  <text class="off" x="30" y="214">0x0D0</text>
  <rect class="box" x="100" y="198" width="300" height="46" rx="6"/>
  <text class="p" x="116" y="217">names, module refs, entry table</text>
  <text class="m" x="116" y="236">MSGBOX  KERNEL  USER</text>

  <text class="off" x="30" y="262">0x110</text>
  <rect class="code" x="100" y="246" width="300" height="168" rx="6"/>
  <text class="h" x="116" y="272">Segment 1: code, 261 bytes</text>
  <text class="p" x="116" y="294">fixed, preloaded, has relocations</text>
  <rect class="site" x="100" y="304" width="300" height="6"/>
  <rect class="site" x="100" y="330" width="300" height="6"/>
  <rect class="site" x="100" y="356" width="300" height="6"/>
  <rect class="site" x="100" y="382" width="300" height="6"/>
  <text class="m" x="116" y="324">9A FF FF 00 00</text>
  <text class="p" x="236" y="324">call far ????:????</text>

  <text class="off" x="30" y="432">0x215</text>
  <rect class="box" x="100" y="416" width="300" height="40" rx="6"/>
  <text class="h" x="116" y="441">4 relocation records</text>

  <text class="off" x="30" y="474">0x240</text>
  <rect class="data" x="100" y="458" width="300" height="70" rx="6"/>
  <rect class="rsv" x="101" y="459" width="298" height="12" rx="5"/>
  <text class="h" x="116" y="494">Segment 2: data, 44 bytes</text>
  <text class="p" x="116" y="515">(first 16 bytes kept free for Windows)</text>

  <text class="off" x="30" y="552">0x26C</text>
  <text class="p" x="100" y="552">end of file</text>

  <path class="line" d="M400 436 C 470 436, 470 307, 406 307" marker-end="url(#a)"/>
  <path class="line" d="M400 436 C 480 436, 480 333, 406 333" marker-end="url(#a)"/>
  <path class="line" d="M400 436 C 490 436, 490 359, 406 359" marker-end="url(#a)"/>
  <path class="line" d="M400 436 C 500 436, 500 385, 406 385" marker-end="url(#a)"/>

  <text class="tool" x="520" y="300">0x001  KERNEL.91  InitTask</text>
  <text class="tool" x="520" y="326">0x03C  USER.5     InitApp</text>
  <text class="tool" x="520" y="352">0x06D  USER.1     MessageBox</text>
  <text class="tool" x="520" y="378">0x093  KERNEL.30  WaitEvent</text>
  <text class="p" x="520" y="410">Each site holds FFFF until the</text>
  <text class="p" x="520" y="428">loader writes the real far address.</text>
</svg>
