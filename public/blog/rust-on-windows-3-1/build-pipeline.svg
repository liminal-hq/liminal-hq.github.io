<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-labelledby="t d">
  <title id="t">From Rust source to a Win16 NE executable</title>
  <desc id="d">Five stages: Rust crates, including import stubs generated from a table of Wine's ordinals, are compiled by rustc with -Zbuild-std for the win16.json code16 target, rust-lld links them with link.ld into an ELF whose code and data both start at address 0, ne_pack.py rewraps the ELF and the resource JSON into an NE executable, and the Windows loader assigns selectors, patches the imports and starts the task.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffaa40"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #0c0c12; }
    .box { fill: #16161f; stroke: rgba(255,255,255,0.2); stroke-width: 1.2; }
    .win { fill: #0f1a3d; stroke: #60a5fa; stroke-width: 1.2; }
    .h { font: 600 17px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
    .p { font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #b4bfce; }
    .m { font: 13.5px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; fill: #22d3ee; }
    .tool { font: 13.5px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; fill: #ffaa40; }
    .line { stroke: #ffaa40; stroke-width: 2; fill: none; }
  </style>
  <rect class="bg" width="760" height="640" rx="14"/>

  <rect class="box" x="30" y="24" width="700" height="76" rx="10"/>
  <text class="h" x="50" y="54">Rust crates</text>
  <text class="m" x="50" y="80">program (w16_main)  +  w16 runtime  +  imports.rs (from imports.tbl)</text>

  <path class="line" d="M80 100 V150" marker-end="url(#a)"/>
  <text class="tool" x="100" y="122">rustc + LLVM, cargo -Zbuild-std, --target win16.json</text>
  <text class="p" x="100" y="142">i386-unknown-none-code16, soft float, panic = abort, opt-level = "z"</text>

  <rect class="box" x="30" y="156" width="700" height="76" rx="10"/>
  <text class="h" x="50" y="186">16-bit code with 32-bit operations</text>
  <text class="p" x="50" y="212">32-bit operands and addresses need 66h and 67h prefixes, so a 386 is the floor</text>

  <path class="line" d="M80 232 V282" marker-end="url(#a)"/>
  <text class="tool" x="100" y="254">rust-lld -T link.ld (OVERLAY 0 : AT(0x1000))</text>
  <text class="p" x="100" y="274">.text and .data both linked at address 0, one per segment</text>

  <rect class="box" x="30" y="288" width="700" height="76" rx="10"/>
  <text class="h" x="50" y="318">ELF with two overlapping sections and labelled holes</text>
  <text class="m" x="50" y="344">__w16imp_USER_1_MessageBox   __w16exp_WizDlgProc   _start</text>

  <path class="line" d="M80 364 V414" marker-end="url(#a)"/>
  <text class="tool" x="100" y="386">ne_pack.py --resources res/setup.json  setup  SETUP.EXE</text>
  <text class="p" x="100" y="406">MZ stub, NE header, segments, fixups, entry table, names, resources</text>

  <rect class="box" x="30" y="420" width="700" height="76" rx="10"/>
  <text class="h" x="50" y="450">SETUP.EXE, 14,944 bytes</text>
  <text class="m" x="50" y="476">code 6,258  +  data 4,624  +  35 imports  +  4 resources</text>

  <path class="line" d="M80 496 V546" marker-end="url(#a)"/>
  <text class="tool" x="100" y="518">KERNEL loads the NE: selectors, fixups, CS:IP = 1:_start</text>
  <text class="p" x="100" y="538">the first instruction is a far call to INITTASK</text>

  <rect class="win" x="30" y="552" width="700" height="66" rx="10"/>
  <text class="h" x="50" y="580">Windows 3.1x in 386 Enhanced mode, or Windows 9x</text>
  <text class="p" x="50" y="603">run on WfW 3.11 in DOSBox-X, Windows ME in VirtualBox, and Wine 11.21</text>
</svg>
