<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d">
  <title id="t">Cross-compiling Rust for Windows Me from Linux</title>
  <desc id="d">Rust source with no_std and raw-dylib import blocks is compiled by rustc 1.98 for i686-pc-windows-msvc with target-cpu=pentium, linked by lld-link with /NODEFAULTLIB, /ENTRY:start, /SUBSYSTEM:WINDOWS,4.0 and /FIXED into a 2,560-byte PE32 file that runs on Windows Me in VirtualBox and under Wine.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b4bfce"/>
    </marker>
    <style>
      .box { fill: #14141b; stroke-width: 2; }
      .h { font: 700 19px 'Space Grotesk', 'Inter', 'DejaVu Sans', sans-serif; fill: #f2f2f2; }
      .t { font: 400 14.5px 'JetBrains Mono', 'DejaVu Sans Mono', monospace; fill: #c9d1dc; }
      .m { font: 400 13px 'Inter', 'DejaVu Sans', sans-serif; fill: #8f9aab; }
      .lbl { font: 600 13px 'Inter', 'DejaVu Sans', sans-serif; fill: #b4bfce; }
      .line { stroke: #b4bfce; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect width="900" height="440" rx="14" fill="#0b0b10"/>
  <text x="30" y="40" class="m">The top row runs on Linux. No Windows SDK, no MSVC, no import libraries.</text>

  <!-- Row 1 -->
  <rect class="box" x="30" y="62" width="250" height="150" rx="10" stroke="#ffaa40"/>
  <text x="48" y="94" class="h">Rust source</text>
  <text x="48" y="124" class="t">#![no_std]</text>
  <text x="48" y="146" class="t">#![no_main]</text>
  <text x="48" y="168" class="t">kind = "raw-dylib"</text>
  <text x="48" y="190" class="t">fn start() -&gt; !</text>

  <rect class="box" x="325" y="62" width="250" height="150" rx="10" stroke="#a78bfa"/>
  <text x="343" y="94" class="h">rustc 1.98</text>
  <text x="343" y="124" class="t">i686-pc-windows-msvc</text>
  <text x="343" y="146" class="t">target-cpu=pentium</text>
  <text x="343" y="168" class="t">panic = "abort"</text>
  <text x="343" y="190" class="t">opt-level = "z", lto</text>

  <rect class="box" x="620" y="62" width="250" height="150" rx="10" stroke="#22d3ee"/>
  <text x="638" y="94" class="h">lld-link</text>
  <text x="638" y="124" class="t">/NODEFAULTLIB</text>
  <text x="638" y="146" class="t">/ENTRY:start</text>
  <text x="638" y="168" class="t">/SUBSYSTEM:WINDOWS,4.0</text>
  <text x="638" y="190" class="t">/FIXED /DYNAMICBASE:NO</text>

  <path class="line" d="M280,137 L321,137" marker-end="url(#arrow)"/>
  <path class="line" d="M575,137 L616,137" marker-end="url(#arrow)"/>

  <!-- Down from lld-link -->
  <path class="line" d="M745,212 L745,262" marker-end="url(#arrow)"/>

  <!-- Row 2 -->
  <rect class="box" x="620" y="266" width="250" height="150" rx="10" stroke="#60a5fa"/>
  <text x="638" y="298" class="h">me-hello.exe</text>
  <text x="638" y="328" class="t">PE32, 2,560 bytes</text>
  <text x="638" y="350" class="t">subsystem 4.0</text>
  <text x="638" y="372" class="t">base 0x00400000</text>
  <text x="638" y="394" class="t">no .reloc, no CRT</text>

  <path class="line" d="M620,341 L579,341" marker-end="url(#arrow)"/>
  <text x="560" y="300" class="lbl" text-anchor="end">floppy image (mtools)</text>
  <text x="560" y="320" class="lbl" text-anchor="end">or a shared folder</text>

  <rect class="box" x="325" y="266" width="250" height="150" rx="10" stroke="#f43f5e"/>
  <text x="343" y="298" class="h">Windows Me</text>
  <text x="343" y="328" class="t">4.90.3000</text>
  <text x="343" y="350" class="t">VirtualBox VM</text>
  <text x="343" y="372" class="m">also runs under Wine</text>
  <text x="343" y="394" class="m">(95 and 98 untested)</text>

  <text x="30" y="300" class="lbl">kernel32.dll</text>
  <text x="30" y="324" class="lbl">user32.dll</text>
  <text x="30" y="348" class="lbl">gdi32.dll</text>
  <text x="30" y="380" class="m">The only DLLs it asks for,</text>
  <text x="30" y="400" class="m">all shipped with Windows 95.</text>
  <path class="line" d="M325,341 L150,341" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
</svg>
