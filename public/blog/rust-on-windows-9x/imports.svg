<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 860" width="440" height="860" role="img" aria-labelledby="t d">
  <title id="t">What stock Rust imports compared with what me-hello.exe imports</title>
  <desc id="d">A comparison. Stock Rust with std for i686-pc-windows-msvc links the MSVC runtime, needs five import libraries, and its standard library references 139 Win32 functions, 38 of them wide-character, plus Nt calls into ntdll, including WaitOnAddress and ProcessPrng, which no Windows before 8 or 10 has; it supports Windows 10 and later, or Windows 7 with the tier-3 win7 targets, and does not link on Linux without an SDK. me-hello.exe links no runtime, needs no import libraries, imports 16 ANSI functions from kernel32, user32 and gdi32, all present in Windows 95, and is 2,560 bytes; it has run on Windows Me, Windows 95 OSR2.5 and Wine.</desc>
  <style>
    .bg { fill: #0c0c12; }
    .std { fill: #2d0f16; stroke: #f87171; stroke-width: 1.2; }
    .me { fill: #0c2a26; stroke: #34d399; stroke-width: 1.2; }
    .h { font: 600 17px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
    .k { font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8b949e; }
    .p { font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #c3ccd8; }
    .r { font: 14px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; fill: #f87171; }
    .g { font: 14px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; fill: #34d399; }
  </style>
  <rect class="bg" width="440" height="860" rx="14"/>
  <rect class="std" x="20" y="20" width="196" height="56" rx="6"/>
  <text class="h" x="32" y="44">Stock Rust</text>
  <text class="p" x="32" y="66">with std</text>
  <rect class="me" x="224" y="20" width="196" height="56" rx="6"/>
  <text class="h" x="236" y="44">me-hello.exe</text>
  <text class="p" x="236" y="66">no_std, raw-dylib</text>

  <text class="k" x="20" y="112">C runtime</text>
  <text class="r" x="20" y="136">/defaultlib:msvcrt</text>
  <text class="p" x="20" y="156">vcruntime140, UCRT</text>
  <text class="g" x="236" y="136">none</text>
  <text class="p" x="236" y="156">/NODEFAULTLIB</text>

  <text class="k" x="20" y="200">Import libraries</text>
  <text class="r" x="20" y="224">kernel32.lib</text>
  <text class="r" x="20" y="244">ntdll.lib userenv.lib</text>
  <text class="r" x="20" y="264">ws2_32.lib dbghelp.lib</text>
  <text class="g" x="236" y="224">none: the import</text>
  <text class="g" x="236" y="244">table comes from</text>
  <text class="g" x="236" y="264">#[link] blocks</text>

  <text class="k" x="20" y="308">Win32 functions</text>
  <text class="p" x="20" y="332">139 in libstd</text>
  <text class="r" x="20" y="352">38 of them ...W</text>
  <text class="p" x="20" y="372">plus Nt* calls</text>
  <text class="p" x="236" y="332">16 in total</text>
  <text class="g" x="236" y="352">ANSI ...A or none</text>
  <text class="p" x="236" y="372">kernel32 5, user32 10,</text>
  <text class="p" x="236" y="392">gdi32 1</text>

  <text class="k" x="20" y="436">Examples</text>
  <text class="r" x="20" y="460">WaitOnAddress</text>
  <text class="r" x="20" y="480">ProcessPrng</text>
  <text class="p" x="20" y="500">none before</text>
  <text class="p" x="20" y="520">Windows 8 or 10</text>
  <text class="g" x="236" y="460">CreateWindowExA</text>
  <text class="g" x="236" y="480">TextOutA</text>
  <text class="g" x="236" y="500">FindFirstFileA</text>
  <text class="p" x="236" y="520">all in Windows 95</text>

  <text class="k" x="20" y="564">Oldest Windows</text>
  <text class="p" x="20" y="588">Windows 10</text>
  <text class="p" x="20" y="608">(7 with the tier-3</text>
  <text class="p" x="20" y="628">win7 targets)</text>
  <text class="p" x="236" y="588">Windows 95 by design</text>
  <text class="p" x="236" y="608">run on Me, 95 OSR2.5</text>
  <text class="p" x="236" y="628">and Wine</text>

  <text class="k" x="20" y="672">File size</text>
  <text class="p" x="20" y="696">doesn't link here</text>
  <text class="p" x="20" y="716">(no import libraries)</text>
  <text class="g" x="236" y="696">2,560 bytes</text>

  <text class="p" x="20" y="766">Counts from llvm-nm on libstd for</text>
  <text class="p" x="20" y="788">i686-pc-windows-msvc (Rust 1.98) and</text>
  <text class="p" x="20" y="810">llvm-objdump -p on me-hello.exe.</text>
</svg>
