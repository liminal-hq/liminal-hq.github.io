<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="t d">
  <title id="t">What stock Rust imports compared with what me-hello.exe imports</title>
  <desc id="d">A comparison table. Stock Rust std for i686-pc-windows-msvc links the MSVC runtime, needs five import libraries, and its standard library references 139 Win32 functions, 38 of them wide-character, including WaitOnAddress, GetSystemTimePreciseAsFileTime and ProcessPrng, and supports Windows 10 and later. me-hello.exe links no runtime, needs no import libraries, imports 16 functions from kernel32, user32 and gdi32 that all exist on Windows 95, and was tested on Windows Me.</desc>
  <style>
    .h { font: 700 18px 'Space Grotesk', 'Inter', 'DejaVu Sans', sans-serif; fill: #f2f2f2; }
    .row { font: 600 14px 'Inter', 'DejaVu Sans', sans-serif; fill: #b4bfce; }
    .t { font: 400 14px 'JetBrains Mono', 'DejaVu Sans Mono', monospace; fill: #d6dbe3; }
    .bad { font: 400 14px 'JetBrains Mono', 'DejaVu Sans Mono', monospace; fill: #fb7185; }
    .good { font: 400 14px 'JetBrains Mono', 'DejaVu Sans Mono', monospace; fill: #5eead4; }
    .m { font: 400 12.5px 'Inter', 'DejaVu Sans', sans-serif; fill: #8f9aab; }
    .rule { stroke: rgba(255,255,255,0.12); stroke-width: 1; }
  </style>
  <rect width="900" height="560" rx="14" fill="#0b0b10"/>

  <rect x="200" y="20" width="340" height="56" rx="8" fill="#2a1219"/>
  <rect x="550" y="20" width="330" height="56" rx="8" fill="#0d2427"/>
  <text x="216" y="45" class="h">Stock Rust, with std</text>
  <text x="216" y="66" class="m">fn main() { println!(…) }, same target</text>
  <text x="566" y="45" class="h">me-hello.exe</text>
  <text x="566" y="66" class="m">no_std, no_main, raw-dylib</text>

  <!-- Row: runtime -->
  <text x="24" y="112" class="row">C runtime</text>
  <text x="216" y="112" class="bad">/defaultlib:msvcrt</text>
  <text x="216" y="132" class="m">vcruntime140.dll and the Universal CRT</text>
  <text x="566" y="112" class="good">none (/NODEFAULTLIB)</text>
  <line x1="20" y1="152" x2="880" y2="152" class="rule"/>

  <!-- Row: import libs -->
  <text x="24" y="180" class="row">Import libraries</text>
  <text x="24" y="198" class="row">at link time</text>
  <text x="216" y="180" class="bad">kernel32.lib ntdll.lib</text>
  <text x="216" y="200" class="bad">userenv.lib ws2_32.lib</text>
  <text x="216" y="220" class="bad">dbghelp.lib</text>
  <text x="566" y="180" class="good">none: the import table is</text>
  <text x="566" y="200" class="good">written from #[link] blocks</text>
  <line x1="20" y1="240" x2="880" y2="240" class="rule"/>

  <!-- Row: functions -->
  <text x="24" y="268" class="row">Win32 functions</text>
  <text x="24" y="286" class="row">referenced</text>
  <text x="216" y="268" class="t">139 in libstd</text>
  <text x="216" y="288" class="bad">38 of them ...W</text>
  <text x="216" y="308" class="m">plus Nt* calls straight into ntdll</text>
  <text x="566" y="268" class="t">16 in total</text>
  <text x="566" y="288" class="good">ANSI ...A or no strings at all</text>
  <text x="566" y="308" class="m">kernel32 5, user32 10, gdi32 1</text>
  <line x1="20" y1="328" x2="880" y2="328" class="rule"/>

  <!-- Row: newest functions -->
  <text x="24" y="356" class="row">Examples</text>
  <text x="24" y="376" class="m">left: none exist</text>
  <text x="24" y="392" class="m">before Windows 8</text>
  <text x="216" y="356" class="bad">WaitOnAddress</text>
  <text x="216" y="376" class="bad">GetSystemTimePreciseAsFileTime</text>
  <text x="216" y="396" class="bad">ProcessPrng</text>
  <text x="566" y="356" class="good">CreateWindowExA, TextOutA,</text>
  <text x="566" y="376" class="good">FindFirstFileA ...</text>
  <text x="566" y="396" class="m">all in Windows 95's own DLLs</text>
  <line x1="20" y1="416" x2="880" y2="416" class="rule"/>

  <!-- Row: oldest Windows -->
  <text x="24" y="444" class="row">Oldest Windows</text>
  <text x="216" y="444" class="t">Windows 10</text>
  <text x="216" y="464" class="m">Windows 7 with the tier-3 *-win7-* targets</text>
  <text x="566" y="444" class="t">Windows 95 by design</text>
  <text x="566" y="464" class="m">tested on Windows Me and Wine</text>
  <line x1="20" y1="484" x2="880" y2="484" class="rule"/>

  <text x="24" y="514" class="row">File size</text>
  <text x="216" y="514" class="m">does not link here (no import libraries)</text>
  <text x="566" y="514" class="t">2,560 bytes</text>
  <text x="24" y="545" class="m">Counts from llvm-nm on libstd for i686-pc-windows-msvc (Rust 1.98) and llvm-objdump -p on me-hello.exe.</text>
</svg>
